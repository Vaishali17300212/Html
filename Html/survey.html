<!DOCTYPE html>
<html>
<head>
  <title>Survey Form</title>
</head>
<body>
  <h1 id="title">vaishali survey form</h1>
  <p id="description">Please fill out this survey form to help us improve.</p>
  <form id="survey-form">
    <label id="name-label">Name</label>
    <input type="text" id="name" name="name" placeholder="fullname" required>

    <label id="email-label">Email</label>
    <input type="email" id="email" placeholder="example@gmail.com"required>

    <label id="number-label">Number</label>
    <input id="number" type="number" min="0" max="10" placeholder="1">
    <select id="dropdown">
      <option value="student">student</option>
      <option value="working">working</option>
    </select>
    <p>Choose your gender:</p>
       <input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label><br>

    <input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>

    <form id="survey-form">

  <p>Select your interests:</p>
  <input type="checkbox" id="coding" name="interest" value="coding">
  <label for="coding">Coding</label><br>

  <input type="checkbox" id="design" name="interest" value="design">
  <label for="design">Design</label><br>

  <p>Any comments or suggestions?</p>
  <textarea id="comments" name="comments" rows="4" cols="30" placeholder="Write here..."></textarea><br><br>

  
  <input type="submit" id="submit" value="submit">

</form>

  
  </form>

  
  

</body>
</html>
